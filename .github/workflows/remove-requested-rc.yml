name: Remove all user-requested prereleases
on:
  push:
    branches: [cleanup-rc-releases-20261020]
    paths: [.github/workflows/remove-requested-rc.yml]
permissions:
  contents: write
jobs:
  remove-rc:
    runs-on: ubuntu-latest
    steps:
      - name: Verify exact RC release identities and remove releases only
        uses: actions/github-script@v7
        with:
          script: |
            const owner = 'xxz3312';
            const repo = 'gboard-rambler-api102';
            const targets = [
              {id: 417296035, tag: 'v0.1.25-cloud-rc1'},
              {id: 417303819, tag: 'v0.1.25-cloud-rc2'},
              {id: 417338528, tag: 'v0.1.26-model-matrix'},
              {id: 417425230, tag: 'v0.1.27-pcs-manifest'},
              {id: 417444059, tag: 'v0.1.28-pcs-details'}
            ];
            // Preflight all identities before deleting either release.
            const existing = [];
            for (const target of targets) {
              let release;
              try {
                release = (await github.rest.repos.getRelease({owner, repo, release_id: target.id})).data;
              } catch (error) {
                if (error.status === 404) {
                  core.info(target.tag + ' is already absent');
                  continue;
                }
                throw error;
              }
              if (release.tag_name !== target.tag || release.prerelease !== true || release.draft) {
                throw new Error('Release identity mismatch: ' + target.tag);
              }
              existing.push(target);
            }
            for (const target of existing) {
              await github.rest.repos.deleteRelease({owner, repo, release_id: target.id});
              core.info('Deleted release and assets: ' + target.tag);
            }
            const remaining = await github.paginate(github.rest.repos.listReleases, {owner, repo, per_page: 100});
            for (const target of targets) {
              if (remaining.some(r => r.tag_name === target.tag)) {
                throw new Error('Release still present: ' + target.tag);
              }
            }
            core.info('Verified all five requested prereleases are absent. Git tags and all other releases were preserved.');
