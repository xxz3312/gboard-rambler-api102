name: Android CI
on:
  workflow_dispatch:
  push:
    branches: [main, writing-tools-upstream-port, port-ocr-screenshot-belka, port-more-upstream-features, universal-upstream-hooks, fix-clipboard-retention, fix-rambler-selector, sync-upstream-1.3.3, port-rambler-controls, hide-native-settings]
jobs:
  debug:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '9.4.1'}
      - name: Install Android SDK platform
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0"
          else
            echo "sdkmanager missing"; exit 1
          fi
      - run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: gboard-rambler-debug-${{ github.ref_name }}
          path: app/build/outputs/apk/debug/*.apk

