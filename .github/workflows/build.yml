name: Android CI
on:
  workflow_dispatch:
  push:
    branches: [main, writing-tools-upstream-port, writing-tools-v2-experiment]
jobs:
  debug:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '9.4.1'}
      - name: Install Android SDK platform
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0"
          else
            echo "sdkmanager missing"; exit 1
          fi
      - run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: gboard-rambler-debug-${{ github.ref_name }}
          path: app/build/outputs/apk/debug/*.apk

  aicore-features:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - name: Test feature-only module and installation guards
        run: python3 -m unittest discover -s experiments/aicore-features/tests -v
      - name: Check direct-install package root
        run: |
          test -f experiments/aicore-features/root-module/module.prop
          test -f experiments/aicore-features/root-module/customize.sh
          test -f experiments/aicore-features/root-module/system/product/etc/sysconfig/pixelboard_aicore_sm8850.xml
          if find experiments/aicore-features/root-module -name '*.zip' | grep -q .; then
            echo "Nested ZIP found in module root"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          # Upload the contents, not a ZIP: GitHub's artifact ZIP IS the module.
          name: AICore-SM8850-Features-0.1.1-INSTALL-DIRECTLY
          path: experiments/aicore-features/root-module/
          if-no-files-found: error


  aicore-system-app:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - name: Test pinned system-app snapshot installer
        run: python3 -m unittest discover -s experiments/aicore-system-app/tests -v
      - name: Check direct-install module contents
        run: |
          test -f experiments/aicore-system-app/root-module/module.prop
          test -f experiments/aicore-system-app/root-module/apk-sha256.txt
          if find experiments/aicore-system-app/root-module -name '*.zip' -o -name '*.apk' | grep -q .; then
            echo "Unexpected nested ZIP or redistributed APK"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: AICore-SM8850-SystemApp-0.1.0-INSTALL-DIRECTLY
          path: experiments/aicore-system-app/root-module/
          if-no-files-found: error
