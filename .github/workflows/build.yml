name: Android CI
on:
  workflow_dispatch:
  push:
    branches: [main, writing-tools-upstream-port, writing-tools-v2-experiment]
jobs:
  debug:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '9.4.1'}
      - name: Install Android SDK platform
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0"
          else
            echo "sdkmanager missing"; exit 1
          fi
      - run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: gboard-rambler-debug-${{ github.ref_name }}
          path: app/build/outputs/apk/debug/*.apk

  aicore-features:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - name: Test feature-only module and installation guards
        run: python3 -m unittest discover -s experiments/aicore-features/tests -v
      - name: Package optional SM8850 root module
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          root = Path("experiments/aicore-features/root-module")
          Path("dist").mkdir(exist_ok=True)
          with ZipFile("dist/AICore-SM8850-Features-0.1.0.zip", "w", ZIP_DEFLATED) as archive:
              for path in sorted(root.rglob("*")):
                  if path.is_file():
                      archive.write(path, path.relative_to(root))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: aicore-sm8850-features-0.1.0
          path: dist/AICore-SM8850-Features-0.1.0.zip
