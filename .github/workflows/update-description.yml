name: Update approved release description
on:
  push:
    branches: [update-release-description]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const {data:r}=await github.rest.repos.getRelease({owner:context.repo.owner,repo:context.repo.repo,release_id:417702042});
            if(r.tag_name!=="v0.1.29") throw new Error("Release identity mismatch");
            await github.rest.repos.updateRelease({owner:context.repo.owner,repo:context.repo.repo,release_id:417702042,body:"移除行内拼写检查实验项，调整写作工具初始化时机，并加入自动适配及不支持版本提示。写作工具修复效果仍待实机验证。"});
