name: Publish 0.2
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-0.2.yml']
concurrency:
  group: publish-0.2
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '9.4.1'}
      - name: Install Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0"
      - name: Verify authorized version
        run: |
          python3 - <<'PY_CHECK'
          from pathlib import Path
          assert 'versionName = "0.2"' in Path('app/build.gradle.kts').read_text()
          assert 'VERSION="0.2"' in Path('app/src/main/java/dev/kaede/pixelboard/CloudRuntimeStatus.java').read_text()
          PY_CHECK
      - name: Test and build
        run: |
          for attempt in 1 2 3; do
            if gradle :app:testDebugUnitTest :app:assembleRelease --stacktrace --no-daemon; then
              exit 0
            fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 15
          done
      - name: Record dependencies
        run: |
          gradle :app:dependencies --configuration releaseRuntimeClasspath --no-daemon > dependencies.txt
          if grep -q 'com.google.mlkit' dependencies.txt; then
            echo "Unexpected ML Kit dependency in stable build"; exit 1
          fi
      - name: Verify APK and package notices
        run: |
          set -eu
          APK=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" > signing-certificate.txt
          unzip -p "$APK" META-INF/xposed/java_init.list > entry.txt
          test -s entry.txt
          python3 .github/scripts/check-release-apk.py "$APK"
          unzip -p "$APK" assets/licenses/GPL-3.0.txt | cmp LICENSE
          unzip -p "$APK" assets/licenses/NOTICE.txt | cmp NOTICE
          mkdir -p dist/notices
          cp LICENSE NOTICE THIRD_PARTY_NOTICES.md dependencies.txt signing-certificate.txt dist/notices/
          cp "$APK" dist/Gboard-Rambler-API102-0.2.apk
          cp app/build/outputs/mapping/release/mapping.txt dist/R8-mapping.txt
          python3 .github/scripts/collect-poms.py
          (cd dist/notices && zip -qr ../third-party-notices.zip .)
          (cd dist && sha256sum *.apk *.zip R8-mapping.txt > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: Gboard-Rambler-0.2
          path: |
            dist/*.apk
            dist/*.zip
            dist/*.txt
            dist/SHA256SUMS
            app/build/reports/tests/testDebugUnitTest/

      - name: Publish authorized 0.2 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if gh release view 0.2 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release 0.2 already exists; refusing to replace it."
            exit 1
          fi
          python3 - <<'PY_RELEASE'
          from pathlib import Path
          import hashlib, re
          apk=Path('dist/Gboard-Rambler-API102-0.2.apk')
          digest=hashlib.sha256(apk.read_bytes()).hexdigest()
          readme=Path('README.md')
          text=readme.read_text()
          text, count=re.subn(r'\d+(?:\.\d+)+ APK 的 SHA-256：\n\n```text\n[0-9a-f]{64}\n```',
              '0.2 APK 的 SHA-256：\n\n```text\n'+digest+'\n```', text, count=1)
          assert count == 1, 'Missing README checksum block'
          readme.write_text(text)
          notes=Path('RELEASE_NOTES.md').read_text().split('\n',1)[1].strip()
          Path('/tmp/release-0.2-notes.md').write_text(notes+'\n')
          Path('/tmp/release-0.2-sha256').write_text(digest)
          PY_RELEASE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: record released 0.2 APK checksum"
          git push origin HEAD:main
          RELEASE_COMMIT="$(git rev-parse HEAD)"
          gh release create 0.2 --repo "$GITHUB_REPOSITORY" --target "$RELEASE_COMMIT" --title "0.2" --draft --notes-file /tmp/release-0.2-notes.md dist/Gboard-Rambler-API102-0.2.apk
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/0.2" > /tmp/release-0.2-metadata.json
          python3 - <<'PY_VERIFY'
          from pathlib import Path
          import json
          release=json.loads(Path('/tmp/release-0.2-metadata.json').read_text())
          assert release['draft'] and not release['prerelease']
          assert len(release['assets']) == 1
          asset=release['assets'][0]
          assert asset['name'] == 'Gboard-Rambler-API102-0.2.apk'
          assert asset['digest'] == 'sha256:'+Path('/tmp/release-0.2-sha256').read_text().strip()
          PY_VERIFY
          gh release edit 0.2 --repo "$GITHUB_REPOSITORY" --draft=false --latest
