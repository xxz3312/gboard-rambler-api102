name: Settings startup regression
on:
  push:
    branches: [fix-settings-startup]
permissions:
  contents: read
jobs:
  startup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '9.4.1'}
      - run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0"
      - run: gradle :app:testDebugUnitTest --tests '*SettingsActivityLaunchTest' --stacktrace --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: settings-startup-report
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
